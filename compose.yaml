services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - app_secrets:/home/node/.invision-u-secrets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: invision
      POSTGRES_USER: invision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invision -d invision"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  app_secrets:
